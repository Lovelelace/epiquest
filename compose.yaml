# Environnement de développement local.
#   docker compose watch             → base + migrations + API (3000) et web (3001) en mode watch :
#                                      sources synchronisées, rebuild et tests relancés à chaque modification
#   docker compose up -d db          → base PostgreSQL seule
#   docker compose run --rm dev      → lance tous les tests dans un conteneur
#   docker compose run --rm dev sh   → shell avec Node 22 et pnpm, sources montées
# L'application mobile ne tourne pas dans Docker : voir apps/mobile/README.md.
name: epiquest

x-app-environment: &app-environment
  DATABASE_URL: postgres://epiquest:epiquest@db:5432/epiquest

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: epiquest
      POSTGRES_PASSWORD: epiquest
      POSTGRES_DB: epiquest
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U epiquest -d epiquest"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Applique les migrations Drizzle, puis s'arrête. Le seed et l'import du SRD s'y ajouteront.
  migrate:
    build:
      context: .
      target: dev
    command: ["pnpm", "--filter", "@epiquest/db", "migrate"]
    environment: *app-environment
    depends_on:
      db:
        condition: service_healthy
    develop:
      watch:
        # Nouvelle migration : l'image est reconstruite et les migrations sont rejouées.
        - action: rebuild
          path: ./apps/db/migrations

  # Conteneur à la demande (tests ponctuels, shell). Profil « tools » : il n'est pas
  # démarré par `docker compose up` ni `watch`, mais `docker compose run dev` l'active.
  dev:
    profiles: [tools]
    build:
      context: .
      target: dev
    environment: *app-environment
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/db/node_modules
      - /app/apps/mobile/node_modules
      - /app/apps/server/node_modules
      - /app/apps/web/node_modules
      - /app/packages/rules/node_modules
      - /app/packages/schemas/node_modules
    depends_on:
      db:
        condition: service_healthy

  # Mode watch (`docker compose watch`) : lance `pnpm dev` (API NestJS, web Next.js, build
  # incrémental et tests en continu des paquets). Pas de montage des sources : Compose les
  # copie dans le conteneur à chaque modification, ce qui déclenche les watchers de façon
  # fiable sur macOS et Windows.
  watch:
    build:
      context: .
      target: dev
    command: ["pnpm", "dev", "--ui=stream"]
    init: true
    environment:
      <<: *app-environment
      PORT: "3000"
      WEB_ORIGIN: http://localhost:3001
      NEXT_PUBLIC_API_URL: http://localhost:3000
    ports:
      - "3000:3000" # API NestJS + Socket.IO
      - "3001:3001" # Web Next.js
    depends_on:
      migrate:
        condition: service_completed_successfully
    develop:
      watch:
        # Code source des paquets et des apps : copié tel quel, les watchers
        # (tsc, vitest, NestJS, Next.js) prennent le relais.
        - action: sync
          path: ./packages
          target: /app/packages
          ignore: &generated
            - "**/node_modules/"
            - "**/dist/"
            - "**/coverage/"
            - "**/.turbo/"
            - "**/.next/"
            - "**/.expo/"
        - action: sync
          path: ./apps
          target: /app/apps
          ignore: *generated
        # Configuration partagée : relue au redémarrage de `pnpm dev`.
        - action: sync+restart
          path: ./turbo.json
          target: /app/turbo.json
        - action: sync+restart
          path: ./tsconfig.base.json
          target: /app/tsconfig.base.json
        # Dépendances : l'image est reconstruite pour refaire `pnpm install`.
        - action: rebuild
          path: ./pnpm-lock.yaml
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./pnpm-workspace.yaml

volumes:
  db-data:
